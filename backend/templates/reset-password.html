<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Restablece tu contraseña</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .btn {
            background: #000;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 8px;
            display: inline-block;
            font-weight: bold;
        }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>¡Hola, {{username}}!</h1>
        <p>Recibimos una solicitud para restablecer tu contraseña.</p>
        <p>Haz clic en el botón para crear una nueva:</p>
        <p style="text-align: center; margin: 40px 0;">
            <a href="{{resetLink}}" class="btn">Restablecer contraseña</a>
        </p>
        <p>Este enlace expirará en 1 hora.</p>
        <p>Si no solicitaste esto, ignora este mensaje.</p>
        <div class="footer">
            <p>© {{currentYear}} Lucesa - Todos los derechos reservados</p>
        </div>
    </div>
</body>

</html>
